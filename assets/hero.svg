<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Daiwik Marrott — Software Engineer</title>
  <desc id="d">F1 start lights go out, then Daiwik Marrott's car #09 drives in. Seeking Software Engineering Internships for Spring 2027.</desc>
  <defs>
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#15151e"/>
      <rect width="4" height="4" fill="#1a1a24"/>
      <rect x="4" y="4" width="4" height="4" fill="#1a1a24"/>
    </pattern>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ff2a1f" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff2a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#15151e" stop-opacity="0"/>
      <stop offset=".55" stop-color="#15151e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#15151e" stop-opacity=".9"/>
    </linearGradient>
    <g id="lit">
      <circle cx="26" cy="50" r="58" fill="url(#halo)"/>
      <circle cx="26" cy="27" r="15" fill="#ff2a1f"/>
      <circle cx="26" cy="73" r="15" fill="#ff2a1f"/>
    </g>
    <clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
    <style>
      .sans{font-family:'Titillium Web','Formula1 Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

      /* Start sequence: each column lights at its delay, all go out together at 3.4s. */
      .lamp{opacity:0;animation:on linear 1 forwards}
      @keyframes on{0%,99.9%{opacity:1}100%{opacity:0}}
      .l1{animation-duration:2.9s;animation-delay:.5s}
      .l2{animation-duration:2.3s;animation-delay:1.1s}
      .l3{animation-duration:1.7s;animation-delay:1.7s}
      .l4{animation-duration:1.1s;animation-delay:2.3s}
      .l5{animation-duration:.5s;animation-delay:2.9s}

      .go{opacity:0;animation:flash 1.6s ease-out 3.4s 1 both}
      @keyframes flash{0%{opacity:0}10%,60%{opacity:1}100%{opacity:0}}

      .rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
      @keyframes rise{from{opacity:0;transform:translateX(-60px) skewX(-12deg)}to{opacity:1;transform:none}}
      .d1{animation-delay:3.45s}.d2{animation-delay:3.6s}.d3{animation-delay:3.75s}.d4{animation-delay:3.9s}.d5{animation-delay:4.05s}

      .car{animation:drive 1.3s cubic-bezier(.15,.85,.25,1) 3.5s 1 both}
      @keyframes drive{from{transform:translateX(-1150px)}to{transform:none}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin .25s linear 3.5s 5}
      @keyframes spin{to{transform:rotate(360deg)}}
      .wake{opacity:0;animation:wake 1.3s ease-out 3.5s 1 both}
      @keyframes wake{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}

      .pulse{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{50%{opacity:.25}}

      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#carbon)"/>
    <rect width="1200" height="400" fill="url(#fade)"/>
    <!-- livery slash -->
    <path d="M0 0h26l-26 70z M0 92l60-92h18L0 120z" fill="#e10600"/>

    <!-- start gantry -->
    <g transform="translate(866 34)">
      <rect x="-14" y="-10" width="320" height="10" rx="3" fill="#2a2a36"/>
      <g id="pod">
        <rect width="52" height="104" rx="8" fill="#0c0c11" stroke="#2a2a36"/>
        <circle cx="26" cy="27" r="15" fill="#2b0b0b"/>
        <circle cx="26" cy="73" r="15" fill="#2b0b0b"/>
      </g>
      <use href="#pod" x="62"/><use href="#pod" x="124"/><use href="#pod" x="186"/><use href="#pod" x="248"/>
      <g class="lamp l1"><use href="#lit"/></g>
      <g class="lamp l2"><use href="#lit" x="62"/></g>
      <g class="lamp l3"><use href="#lit" x="124"/></g>
      <g class="lamp l4"><use href="#lit" x="186"/></g>
      <g class="lamp l5"><use href="#lit" x="248"/></g>
      <text class="mono go" x="146" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="3">LIGHTS OUT AND AWAY WE GO</text>
    </g>

    <!-- driver block -->
    <text class="mono rise d1" x="60" y="92" font-size="14" font-weight="700" fill="#e10600" letter-spacing="4">DRIVER PROFILE · SEASON 2026</text>
    <text class="sans rise d2" x="56" y="170" font-size="78" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="-1">DAIWIK MARROTT</text>
    <text class="sans rise d3" x="60" y="214" font-size="22" font-weight="600" fill="#f2f2f2">Software Engineer · Computing Science @ Simon Fraser University</text>
    <text class="mono rise d4" x="60" y="246" font-size="15" fill="#9a9aab">Full-Stack  /  Applied AI &amp; LLM tooling  /  Reliability engineering</text>

    <g class="rise d5">
      <rect x="60" y="272" width="652" height="44" rx="22" fill="#0b2a18" stroke="#00d26a" stroke-width="1.5"/>
      <circle class="pulse" cx="86" cy="294" r="6" fill="#00d26a"/>
      <text class="mono" x="104" y="299" font-size="15" font-weight="700" fill="#ffffff" letter-spacing=".5">PIT LANE OPEN · Seeking SWE Internships · <tspan fill="#00d26a">Spring 2027</tspan></text>
    </g>

    <!-- car #09 -->
    <g transform="translate(760 262)">
      <g class="wake" stroke="#ffffff" stroke-linecap="round">
        <path d="M-40 20h-240M-20 38h-320M-60 56h-200" stroke-width="2" opacity=".6"/>
      </g>
      <g class="car">
        <ellipse cx="200" cy="96" rx="200" ry="7" fill="#000" opacity=".45"/>
        <!-- rear wing -->
        <rect x="6" y="14" width="56" height="10" rx="2" fill="#e10600"/>
        <rect x="6" y="28" width="56" height="5" rx="2" fill="#e10600"/>
        <rect x="40" y="14" width="8" height="50" fill="#1c1c24"/>
        <!-- floor + body -->
        <rect x="40" y="70" width="320" height="6" rx="3" fill="#1c1c24"/>
        <path d="M44 72V46l70-6 24-24h44l18 20 120 12 60 10 10 12z" fill="#e10600"/>
        <path d="M120 58l218 0 20 6H120z" fill="#ffffff"/>
        <path d="M150 34q28-28 62 2" fill="none" stroke="#1c1c24" stroke-width="6" stroke-linecap="round"/>
        <rect x="160" y="16" width="16" height="10" rx="3" fill="#ffd12e"/>
        <text class="sans" x="232" y="54" font-size="18" font-weight="900" font-style="italic" fill="#ffffff">09</text>
        <!-- front wing -->
        <rect x="350" y="72" width="54" height="7" rx="2" fill="#e10600"/>
        <rect x="396" y="60" width="6" height="19" fill="#1c1c24"/>
        <!-- wheels -->
        <g id="wheel">
          <circle cx="78" cy="70" r="26" fill="#0b0b0f"/>
          <circle cx="78" cy="70" r="26" fill="none" stroke="#ff2a1f" stroke-width="3" stroke-dasharray="14 8"/>
          <g class="spin"><circle cx="78" cy="70" r="13" fill="#3a3a48"/><path d="M78 59v22M67 70h22" stroke="#15151e" stroke-width="3"/></g>
        </g>
        <use href="#wheel" x="246"/>
      </g>
    </g>

    <!-- kerb -->
    <g transform="translate(0 378)">
      <rect width="1200" height="22" fill="#ffffff"/>
      <path d="M0 0h40l-12 22H-12zM80 0h40l-12 22H68zM160 0h40l-12 22h-40zM240 0h40l-12 22h-40zM320 0h40l-12 22h-40zM400 0h40l-12 22h-40zM480 0h40l-12 22h-40zM560 0h40l-12 22h-40zM640 0h40l-12 22h-40zM720 0h40l-12 22h-40zM800 0h40l-12 22h-40zM880 0h40l-12 22h-40zM960 0h40l-12 22h-40zM1040 0h40l-12 22h-40zM1120 0h40l-12 22h-40zM1200 0h40l-12 22h-40z" fill="#e10600"/>
    </g>
  </g>
</svg>
