<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
  <title id="t">Team radio: Daiwik is seeking a Software Engineering Internship for Spring 2027.</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="150" rx="16"/></clipPath>
    <style>
      .sans{font-family:'Titillium Web','Formula1 Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .bar{transform-box:fill-box;transform-origin:center;animation:talk .9s ease-in-out 7 both}
      @keyframes talk{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
      .line{animation:in .6s ease-out both}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .a{animation-delay:.3s}.b{animation-delay:1.4s}.c{animation-delay:2.5s}
      .rec{animation:blink 1.2s steps(2) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="#15151e"/>
    <rect width="250" height="150" fill="#e10600"/>
    <path d="M250 0h28l-28 150z" fill="#e10600"/>
    <text class="sans" x="32" y="62" font-size="30" font-weight="900" font-style="italic" fill="#ffffff">TEAM RADIO</text>
    <text class="mono" x="32" y="92" font-size="14" font-weight="700" fill="#ffffff" opacity=".85">MARROTT  #09</text>
    <circle class="rec" cx="38" cy="116" r="5" fill="#ffffff"/>
    <text class="mono" x="50" y="121" font-size="12" fill="#ffffff" opacity=".85">LIVE · CH 1</text>

    <g fill="#ff2a1f" transform="translate(300 75)">
      <rect class="bar" x="0"   y="-10" width="5" height="20" rx="2.5" style="animation-delay:-.1s"/>
      <rect class="bar" x="10"  y="-22" width="5" height="44" rx="2.5" style="animation-delay:-.4s"/>
      <rect class="bar" x="20"  y="-14" width="5" height="28" rx="2.5" style="animation-delay:-.7s"/>
      <rect class="bar" x="30"  y="-30" width="5" height="60" rx="2.5" style="animation-delay:-.2s"/>
      <rect class="bar" x="40"  y="-18" width="5" height="36" rx="2.5" style="animation-delay:-.5s"/>
      <rect class="bar" x="50"  y="-26" width="5" height="52" rx="2.5" style="animation-delay:-.8s"/>
      <rect class="bar" x="60"  y="-12" width="5" height="24" rx="2.5" style="animation-delay:-.3s"/>
      <rect class="bar" x="70"  y="-34" width="5" height="68" rx="2.5" style="animation-delay:-.6s"/>
      <rect class="bar" x="80"  y="-20" width="5" height="40" rx="2.5" style="animation-delay:-.15s"/>
      <rect class="bar" x="90"  y="-28" width="5" height="56" rx="2.5" style="animation-delay:-.45s"/>
      <rect class="bar" x="100" y="-14" width="5" height="28" rx="2.5" style="animation-delay:-.75s"/>
      <rect class="bar" x="110" y="-24" width="5" height="48" rx="2.5" style="animation-delay:-.25s"/>
      <rect class="bar" x="120" y="-10" width="5" height="20" rx="2.5" style="animation-delay:-.55s"/>
      <rect class="bar" x="130" y="-18" width="5" height="36" rx="2.5" style="animation-delay:-.85s"/>
      <rect class="bar" x="140" y="-8"  width="5" height="16" rx="2.5" style="animation-delay:-.35s"/>
    </g>

    <text class="sans line a" x="480" y="54" font-size="23" font-weight="700" fill="#ffffff">“Box, box. We're hunting for a <tspan fill="#ff2a1f">Software Engineering</tspan></text>
    <text class="sans line b" x="480" y="86" font-size="23" font-weight="700" fill="#ffffff"><tspan fill="#ff2a1f">Internship for Spring 2027</tspan>. Recruiters, the pit wall is open.”</text>
    <text class="mono line c" x="480" y="120" font-size="13" fill="#9a9aab" letter-spacing=".5">OPEN TO: SWE · FULL-STACK · AI/LLM TOOLING   —   daiwikmarrott4@gmail.com</text>
  </g>
</svg>
