<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t">
  <title id="t">Chequered flag: thanks for visiting the paddock.</title>
  <defs>
    <pattern id="chk" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#ffffff"/>
      <rect width="14" height="14" fill="#0b0b0f"/>
      <rect x="14" y="14" width="14" height="14" fill="#0b0b0f"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="150" rx="16"/></clipPath>
    <style>
      .sans{font-family:'Titillium Web','Formula1 Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .wave{transform-origin:0 0;animation:wave 1.1s ease-in-out 8 alternate both}
      @keyframes wave{from{transform:skewY(-5deg) scaleX(.96)}to{transform:skewY(5deg) scaleX(1)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="#15151e"/>
    <rect x="60" y="22" width="5" height="112" rx="2" fill="#9a9aab"/>
    <g transform="translate(65 26)"><rect class="wave" width="112" height="70" fill="url(#chk)"/></g>
    <text class="sans" x="230" y="70" font-size="34" font-weight="900" font-style="italic" fill="#ffffff">THANKS FOR VISITING THE PADDOCK</text>
    <text class="mono" x="232" y="104" font-size="15" fill="#9a9aab">Spring 2027 SWE internship? Let's talk strategy → <tspan fill="#ff2a1f">daiwikmarrott4@gmail.com</tspan></text>
  </g>
</svg>
