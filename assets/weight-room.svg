<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">The weight room: a barbell loads up and lifts. Coding personal records: best day 14 contributions, longest streak 5 days.</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:'Titillium Web','Formula1 Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .plate{animation:.45s cubic-bezier(.2,.8,.2,1) both}
      .pl{animation-name:inl}.pr{animation-name:inr}
      @keyframes inl{from{opacity:0;transform:translateX(-140px)}to{opacity:1;transform:none}}
      @keyframes inr{from{opacity:0;transform:translateX(140px)}to{opacity:1;transform:none}}
      .lift{animation:lift 1.4s ease-in-out 1.2s 2 both}
      @keyframes lift{0%,100%{transform:none}45%,60%{transform:translateY(-38px)}}
      .shadow{transform-box:fill-box;transform-origin:center;animation:shrink 1.4s ease-in-out 1.2s 2 both}
      @keyframes shrink{0%,100%{transform:none;opacity:.5}45%,60%{transform:scaleX(.75);opacity:.25}}
      .row{animation:in .5s ease-out both}
      @keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#15151e"/>
    <rect width="600" height="300" fill="#101017"/>
    <text class="sans" x="32" y="46" font-size="22" font-weight="900" font-style="italic" fill="#ffffff">THE WEIGHT ROOM</text>
    <text class="mono" x="34" y="70" font-size="12" fill="#9a9aab" letter-spacing="2">OFF TRACK · TRAINING DAY</text>
    <rect x="40" y="262" width="520" height="6" rx="3" fill="#262633"/>
    <ellipse class="shadow" cx="300" cy="258" rx="230" ry="6" fill="#000"/>
    <g transform="translate(0 30)">
      <g class="lift">
        <rect x="70" y="146" width="460" height="8" rx="4" fill="#b9b9c6"/>
        <rect x="70" y="141" width="70" height="18" rx="4" fill="#d8d8e0"/>
        <rect x="460" y="141" width="70" height="18" rx="4" fill="#d8d8e0"/>
        <rect x="196" y="138" width="8" height="24" rx="2" fill="#6b6b7b"/>
        <rect x="396" y="138" width="8" height="24" rx="2" fill="#6b6b7b"/>
        <rect class="plate pl" style="animation-delay:0.20s" x="178" y="75" width="18" height="150" rx="3" fill="#e10600"/><rect class="plate pl" style="animation-delay:0.38s" x="159" y="75" width="16" height="150" rx="3" fill="#2f80ff"/><rect class="plate pl" style="animation-delay:0.56s" x="142" y="89" width="14" height="122" rx="3" fill="#ffd12e"/><rect class="plate pl" style="animation-delay:0.74s" x="127" y="100" width="12" height="100" rx="3" fill="#39d353"/><rect class="plate pr" style="animation-delay:0.20s" x="404" y="75" width="18" height="150" rx="3" fill="#e10600"/><rect class="plate pr" style="animation-delay:0.38s" x="425" y="75" width="16" height="150" rx="3" fill="#2f80ff"/><rect class="plate pr" style="animation-delay:0.56s" x="444" y="89" width="14" height="122" rx="3" fill="#ffd12e"/><rect class="plate pr" style="animation-delay:0.74s" x="461" y="100" width="12" height="100" rx="3" fill="#39d353"/>
      </g>
    </g>
    <text class="sans" x="650" y="46" font-size="22" font-weight="900" font-style="italic" fill="#ffffff">PERSONAL RECORDS</text>
    <text class="mono" x="652" y="70" font-size="12" fill="#e10600" letter-spacing="2">THE OTHER KIND OF PR · ONE REP = ONE CONTRIBUTION</text>
    <g class="row" style="animation-delay:1s">
      <text class="mono" x="650" y="108" font-size="12" fill="#9a9aab" letter-spacing="1.5">HEAVIEST SESSION · BEST DAY</text>
      <text class="mono" x="1168" y="108" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">14 reps · Oct 23</text>
      <line x1="650" x2="1168" y1="122" y2="122" stroke="#262633"/>
    </g>
<g class="row" style="animation-delay:1.1s">
      <text class="mono" x="650" y="152" font-size="12" fill="#9a9aab" letter-spacing="1.5">LONGEST STREAK · NO REST DAYS</text>
      <text class="mono" x="1168" y="152" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">5 days</text>
      <line x1="650" x2="1168" y1="166" y2="166" stroke="#262633"/>
    </g>
<g class="row" style="animation-delay:1.2s">
      <text class="mono" x="650" y="196" font-size="12" fill="#9a9aab" letter-spacing="1.5">TRAINING DAYS · 12M</text>
      <text class="mono" x="1168" y="196" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">16</text>
      <line x1="650" x2="1168" y1="210" y2="210" stroke="#262633"/>
    </g>
<g class="row" style="animation-delay:1.3s">
      <text class="mono" x="650" y="240" font-size="12" fill="#9a9aab" letter-spacing="1.5">AVG REPS PER SESSION</text>
      <text class="mono" x="1168" y="240" font-size="18" font-weight="700" fill="#ffffff" text-anchor="end">4.6</text>
      <line x1="650" x2="1168" y1="254" y2="254" stroke="#262633"/>
    </g>
    <text class="mono" x="650" y="282" font-size="12" fill="#6b6b7b">// progressive overload, applied to code</text>
  </g>
</svg>
