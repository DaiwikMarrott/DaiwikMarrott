name: Contribution Grand Prix

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/f1-track.svg?color_snake=#E10600&color_dots=#ebedf0,#ffc9c4,#ff8a80,#f0443a,#c40500
            dist/f1-track-dark.svg?palette=github-dark&color_snake=#FF2A1F&color_dots=#161b22,#4a0d0d,#7d1010,#b30d0d,#ff2a1f
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
